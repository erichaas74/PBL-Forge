<!DOCTYPE html>
<html  lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DNA Mutations Explorer</title>
<style>
:root{
  --a:#58b33b; --t:#ef493f; --c:#2877e8; --g:#f3ae19;
  --ink:#0f1c3b; --muted:#5e6d89; --line:#dbe5f3; --blue:#2367ef;
  --panel:#ffffff; --bg:#edf4fd;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:
radial-gradient(circle at 15% 10%,rgba(95,159,255,.15),transparent 28%),
linear-gradient(180deg,#eef5ff 0%,#f7faff 55%,#eaf2fc 100%);padding:18px}
button,input,select{font:inherit}
.app{max-width:1380px;margin:auto;background:rgba(255,255,255,.95);border:1px solid rgba(189,204,226,.75);border-radius:28px;box-shadow:0 18px 55px rgba(52,83,130,.18);padding:26px 28px 24px;backdrop-filter:blur(10px)}
.title-row{display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0 20px}
.logo{width:46px;height:46px;position:relative}
.logo:before,.logo:after{content:"";position:absolute;left:20px;top:2px;width:7px;height:42px;border-radius:9px;background:linear-gradient(#2f86ff,#194fc9);transform:rotate(34deg)}
.logo:after{transform:rotate(-34deg)}
.logo i{position:absolute;left:8px;width:28px;height:3px;border-radius:4px;background:#2b70e7}.logo i:nth-child(1){top:8px}.logo i:nth-child(2){top:16px}.logo i:nth-child(3){top:25px}.logo i:nth-child(4){top:34px}
h1{font-size:clamp(2rem,4vw,4rem);letter-spacing:-.04em;margin:0;font-weight:850}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fbfdff;margin-bottom:22px}
.tab{border:0;border-right:1px solid var(--line);padding:18px 12px;background:transparent;color:#18315f;font-weight:700;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:center;transition:.2s}
.tab:last-child{border-right:0}.tab:hover{background:#eef5ff}.tab.active{background:linear-gradient(180deg,#2f7cff,#1057dc);color:white;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tab .ico{font-size:1.35rem}
.controls{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:end;padding:16px 24px;border:1px solid var(--line);border-radius:18px;background:#fbfdff}
.group{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}.group label{font-weight:800;font-size:1.05rem;white-space:nowrap}.group input,.group select{height:58px;border:1px solid #cfd9e7;border-radius:13px;background:white;padding:0 20px;color:var(--ink);font-size:1.35rem;font-weight:800;letter-spacing:.14em;outline:none;box-shadow:inset 0 1px 2px rgba(30,60,100,.05)}
.group input:focus,.group select:focus{border-color:#5a8cf5;box-shadow:0 0 0 4px rgba(57,112,235,.12)}
.info{margin:18px 0;border:1px solid #cfe0fb;border-radius:18px;padding:18px 24px;background:linear-gradient(90deg,#f4f8ff,#eef5ff);display:flex;align-items:flex-start;gap:16px;font-size:1.08rem;line-height:1.5}.info-badge{flex:0 0 42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#2f7cff,#1554ce);color:white;font-weight:900;font-size:1.3rem}.info strong{color:#165ee3}
.stage{position:relative;border:1px solid var(--line);border-radius:22px;background:
radial-gradient(circle at 50% 43%,rgba(84,144,255,.14),transparent 26%),linear-gradient(180deg,#ffffff,#f7fbff);min-height:520px;overflow:hidden;padding:24px 24px 92px;transition:min-height .35s ease}
#svgStage{width:100%;height:430px;display:block;overflow:visible;transition:height .35s ease}
.stage.replication-stage{min-height:728px}
.stage.replication-stage #svgStage{height:602px}
.legend{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:nowrap;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:14px;padding:10px 20px;box-shadow:0 7px 24px rgba(50,80,125,.10);white-space:nowrap;max-width:calc(100% - 28px)}.legend-item{display:flex;align-items:center;gap:10px;font-weight:650;color:#293d66;line-height:1;min-width:max-content}.chip{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:white;font-weight:900;box-shadow:inset 0 2px 3px rgba(255,255,255,.45),0 3px 8px rgba(30,45,80,.2)}.legend-line{width:52px;border-top:3px dashed #2b62bf;display:inline-block;transform:translateY(-1px)}
#zoomWrap{display:none;height:440px;border-radius:16px;overflow:hidden;background:#f8fbff}#dnaCanvas{width:100%;height:100%;display:block;cursor:grab}#dnaCanvas:active{cursor:grabbing}
.error{border-color:#ef4444!important}.hidden{display:none!important}
@media(max-width:900px){.app{padding:18px}.tabs{grid-template-columns:1fr 1fr}.tab{border-bottom:1px solid var(--line)}.controls{grid-template-columns:1fr}.group{grid-template-columns:1fr}.legend{gap:12px;flex-wrap:wrap;white-space:normal;width:calc(100% - 20px);padding:10px 14px}.stage{padding-inline:8px}}
</style>
</head>
<body>
<div class="app">
  <div class="title-row"><div class="logo"><i></i><i></i><i></i><i></i></div><h1>DNA Mutations Explorer</h1></div>
  <div class="tabs">
    <button class="tab active" data-type="insertion"><span class="ico">⊕</span>Insertion</button>
    <button class="tab" data-type="deletion"><span class="ico">⊖</span>Deletion</button>
    <button class="tab" data-type="substitution"><span class="ico">⇄</span>Substitution</button>
    <button class="tab" data-type="unzip"><span class="ico">⤢</span>Unzipping</button>
    <button class="tab" data-type="replication"><span class="ico">DNA</span>Replication</button>
    <button class="tab" data-type="transcription"><span class="ico">RNA</span>Transcription</button>
    <button class="tab" data-type="zoom"><span class="ico">⌕</span>Zoom Viewer</button>
  </div>
  <div class="controls" id="controls">
    <div class="group"><label for="sequence">Base Sequence (Max 12):</label><input id="sequence" maxlength="12" value="AGTCAT"></div>
    <div class="group" id="mutantGroup"><label id="mutantLabel" for="mutant">Inserting Base:</label><select id="mutant"><option>A</option><option selected>C</option><option>G</option><option>T</option></select></div>
  </div>
  <div class="info"><div class="info-badge">i</div><div id="description"></div></div>
  <div class="stage" id="mainStage">
    <svg id="svgStage" viewBox="0 0 1200 450" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="zoomWrap"><canvas id="dnaCanvas"></canvas></div>
    <div class="legend" id="legend">
      <div class="legend-item"><span class="chip" style="background:var(--a)">A</span>Adenine</div>
      <div class="legend-item"><span class="chip" style="background:var(--t)">T</span>Thymine</div>
      <div class="legend-item"><span class="chip" style="background:var(--c)">C</span>Cytosine</div>
      <div class="legend-item"><span class="chip" style="background:var(--g)">G</span>Guanine</div>
      <div class="legend-item"><span class="legend-line"></span>Hydrogen Bonds</div>
    </div>
  </div>
</div>
<script>
const complements={A:'T',T:'A',C:'G',G:'C'};
const colors={A:'#58b33b',T:'#ef493f',C:'#2877e8',G:'#f3ae19'};
const tabs=[...document.querySelectorAll('.tab')];
const sequence=document.getElementById('sequence');
const mutant=document.getElementById('mutant');
const mutantGroup=document.getElementById('mutantGroup');
const mutantLabel=document.getElementById('mutantLabel');
const description=document.getElementById('description');
const svg=document.getElementById('svgStage');
const zoomWrap=document.getElementById('zoomWrap');
const controls=document.getElementById('controls');
const legend=document.getElementById('legend');
const mainStage=document.getElementById('mainStage');
let mode='insertion', timers=[];
const descriptions={
 insertion:'<strong>Insertion:</strong> An extra nucleotide pair drops in, forcing the sequence to spread apart. This often causes a frameshift in real biology.',
 deletion:'<strong>Deletion:</strong> One nucleotide pair is removed and the remaining sequence shifts together to close the gap.',
 substitution:'<strong>Substitution:</strong> One base pair is exchanged for another. This changes one position without shifting the entire sequence.',
 unzip:'<strong>Unzipping:</strong> The hydrogen bonds separate and the two DNA strands pull apart, modeling helicase action.',
 replication:'<strong>DNA Replication:</strong> Each original DNA strand acts as a template. A new complementary DNA strand attaches to each one, producing two identical DNA molecules. DNA uses only A, T, C, and G.',
 transcription:'<strong>Transcription:</strong> RNA polymerase reads the DNA template strand and builds a complementary mRNA strand. RNA uses uracil (U) instead of thymine (T).',
 zoom:'<strong>Interactive Zoom Viewer:</strong> Scroll to zoom and drag to move across a long DNA sequence.'
};
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function validSeq(){const v=sequence.value.toUpperCase(); const ok=/^[ACGT]+$/.test(v); sequence.classList.toggle('error',!ok); return ok?v:null}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function defs(){return `<defs>
<linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9c7ff"/><stop offset=".45" stop-color="#5c81d6"/><stop offset="1" stop-color="#244a9a"/></linearGradient>
<linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef4ff"/><stop offset=".35" stop-color="#91a9dc"/><stop offset="1" stop-color="#36528f"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#243b68" flood-opacity=".25"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>`}
function pair(x,top,bottom,opacity=1){return `<g class="pair" transform="translate(${x},0)" opacity="${opacity}" filter="url(#shadow)">
<line x1="0" y1="164" x2="0" y2="226" stroke="#7b8baa" stroke-width="3" stroke-dasharray="5 6"/>
<circle cx="0" cy="112" r="11" fill="url(#node)"/>
<circle cx="0" cy="278" r="11" fill="url(#node)"/>
<rect x="-22" y="122" width="44" height="66" rx="12" fill="${colors[top]}" stroke="rgba(20,35,65,.35)" stroke-width="2"/>
<rect x="-22" y="202" width="44" height="66" rx="12" fill="${colors[bottom]}" stroke="rgba(20,35,65,.35)" stroke-width="2"/>
<text x="0" y="165" text-anchor="middle" font-size="28" font-weight="900" fill="white">${top}</text>
<text x="0" y="246" text-anchor="middle" font-size="28" font-weight="900" fill="white">${bottom}</text>
</g>`}
function rails(xs, split=false){const min=Math.min(...xs)-45,max=Math.max(...xs)+45; if(!split)return `<path d="M ${min} 112 Q ${(min+max)/2} 88 ${max} 112" fill="none" stroke="url(#rail)" stroke-width="15" stroke-linecap="round" filter="url(#shadow)"/><path d="M ${min} 278 Q ${(min+max)/2} 302 ${max} 278" fill="none" stroke="url(#rail)" stroke-width="15" stroke-linecap="round" filter="url(#shadow)"/>`;
return ''}
function nodes(xs){return xs.map(x=>`<circle cx="${x}" cy="112" r="10" fill="url(#node)"/><circle cx="${x}" cy="278" r="10" fill="url(#node)"/>`).join('')}
function label(x1,x2,text,y=350){return `<path d="M ${x1} ${y-10} q 0 10 12 10 h ${x2-x1-24} q 12 0 12 -10" fill="none" stroke="#536b9e" stroke-width="2"/><text x="${(x1+x2)/2}" y="${y+24}" text-anchor="middle" font-size="17" font-weight="700" fill="#203c78">${text}</text>`}
function setSvg(body){svg.innerHTML=defs()+body}
function render(){clearTimers();description.innerHTML=descriptions[mode];mainStage.classList.toggle('replication-stage',mode==='replication');svg.setAttribute('viewBox',mode==='replication'?'0 0 1200 620':'0 0 1200 450');if(mode==='zoom'){svg.style.display='none';zoomWrap.style.display='block';controls.style.display='none';legend.style.display='none';resizeCanvas();drawCanvas();return}svg.style.display='block';zoomWrap.style.display='none';controls.style.display='grid';legend.style.display='flex';if(mode==='deletion'||mode==='unzip'||mode==='replication'||mode==='transcription')mutantGroup.classList.add('hidden');else{mutantGroup.classList.remove('hidden');mutantLabel.textContent=mode==='insertion'?'Inserting Base:':'New Base:'}const seq=validSeq();if(!seq)return;if(mode==='insertion')animateInsertion(seq);if(mode==='deletion')animateDeletion(seq);if(mode==='substitution')animateSubstitution(seq);if(mode==='unzip')animateUnzip(seq);if(mode==='replication')animateReplication(seq);if(mode==='transcription')animateTranscription(seq)}
function basePositions(count){const start=120,end=1080; if(count===1)return[600]; return Array.from({length:count},(_,i)=>start+i*(end-start)/(count-1))}
function animateInsertion(seq){const index=Math.floor(seq.length/2),m=mutant.value;const x0=basePositions(seq.length),x1=basePositions(seq.length+1);let body=rails(x0)+nodes(x0)+x0.map((x,i)=>pair(x,seq[i],complements[seq[i]])).join('')+label(x0[0]-35,x0.at(-1)+35,'Original Sequence');setSvg(body);
later(()=>{body=rails(x1)+nodes(x1)+seq.split('').map((b,i)=>pair(x1[i>=index?i+1:i],b,complements[b])).join('')+`<g id="incoming" transform="translate(${x1[index]},-130)" opacity="0"><circle cx="0" cy="170" r="85" fill="rgba(55,120,255,.12)" filter="url(#glow)"/><path d="M 0 78 V 115" stroke="#2b67ef" stroke-width="8" stroke-linecap="round"/><path d="M -14 103 L 0 121 L 14 103" fill="#2b67ef"/>${pair(0,m,complements[m]).replace('transform="translate(0,0)"','transform="translate(0,-35)"')}</g>`+label(x1[0]-35,x1.at(-1)+35,'Sequence After Insertion');setSvg(body);requestAnimationFrame(()=>{const g=document.getElementById('incoming');g.style.transition='transform 1.1s cubic-bezier(.2,.9,.25,1),opacity .35s';g.style.opacity='1';g.setAttribute('transform',`translate(${x1[index]},0)`)})},900);later(render,4800)}
function animateDeletion(seq){if(seq.length<2)return;const index=Math.floor(seq.length/2),x0=basePositions(seq.length),x1=basePositions(seq.length-1);setSvg(rails(x0)+nodes(x0)+x0.map((x,i)=>pair(x,seq[i],complements[seq[i]])).join('')+label(x0[0]-35,x0.at(-1)+35,'Original Sequence'));later(()=>{const old=svg.querySelectorAll('.pair')[index];old.style.transition='transform .9s ease,opacity .7s';old.style.transform=`translate(${x0[index]}px,-120px)`;old.style.opacity='0'},800);later(()=>{setSvg(rails(x1)+nodes(x1)+seq.split('').filter((_,i)=>i!==index).map((b,i)=>pair(x1[i],b,complements[b])).join('')+label(x1[0]-35,x1.at(-1)+35,'Sequence After Deletion'))},1900);later(render,4400)}
function animateSubstitution(seq){const index=Math.floor(seq.length/2),x=basePositions(seq.length),old=seq[index],m=mutant.value===old?(old==='A'?'C':'A'):mutant.value;setSvg(rails(x)+nodes(x)+x.map((p,i)=>pair(p,seq[i],complements[seq[i]])).join('')+label(x[0]-35,x.at(-1)+35,'Original Sequence'));later(()=>{const g=svg.querySelectorAll('.pair')[index];g.style.transition='opacity .5s,transform .8s';g.style.opacity='0';g.style.transform=`translate(${x[index]}px,-90px)`},850);later(()=>{setSvg(rails(x)+nodes(x)+seq.split('').map((b,i)=>pair(x[i],i===index?m:b,complements[i===index?m:b])).join('')+`<circle cx="${x[index]}" cy="195" r="80" fill="none" stroke="#2a6bf1" stroke-width="4" stroke-dasharray="7 7"/>`+label(x[0]-35,x.at(-1)+35,'Sequence After Substitution'))},1650);later(render,4300)}
function animateUnzip(seq){const x=basePositions(seq.length),mid=Math.floor(seq.length/2);let body=rails(x)+nodes(x)+x.map((p,i)=>pair(p,seq[i],complements[seq[i]])).join('');setSvg(body);later(()=>{let top='',bot='';x.forEach((p,i)=>{const d=Math.max(0,i-mid+1)*16;top+=`<g transform="translate(${p},${-d})"><circle cx="0" cy="112" r="10" fill="url(#node)"/><rect x="-22" y="122" width="44" height="66" rx="12" fill="${colors[seq[i]]}"/><text x="0" y="165" text-anchor="middle" font-size="28" font-weight="900" fill="white">${seq[i]}</text></g>`;bot+=`<g transform="translate(${p},${d})"><circle cx="0" cy="278" r="10" fill="url(#node)"/><rect x="-22" y="202" width="44" height="66" rx="12" fill="${colors[complements[seq[i]]]}"/><text x="0" y="246" text-anchor="middle" font-size="28" font-weight="900" fill="white">${complements[seq[i]]}</text></g>`});const left=x[0]-45,right=x.at(-1)+45;setSvg(`<path d="M ${left} 112 Q ${x[mid]} 80 ${right} 35" fill="none" stroke="url(#rail)" stroke-width="15" stroke-linecap="round"/><path d="M ${left} 278 Q ${x[mid]} 310 ${right} 355" fill="none" stroke="url(#rail)" stroke-width="15" stroke-linecap="round"/>${top}${bot}<text x="820" y="194" font-size="18" font-weight="800" fill="#2b67ef">Hydrogen bonds breaking</text><path d="M 808 200 C 780 210 760 220 735 236" fill="none" stroke="#2b67ef" stroke-width="3" marker-end="url(#arrow)"/>`)},900);later(render,5200)}


function animateReplication(seq){
 const x=basePositions(seq.length),comp=seq.split('').map(b=>complements[b]);
 const left=x[0]-45,right=x.at(-1)+45;
 const oldRail='#315aab',newRail='#3aa7b8';
 let originalTop='',originalBottom='';
 x.forEach((p,i)=>{
  originalTop+=`<g transform="translate(${p},0)"><circle cx="0" cy="105" r="10" fill="url(#node)"/><rect x="-22" y="116" width="44" height="54" rx="11" fill="${colors[seq[i]]}"/><text x="0" y="152" text-anchor="middle" font-size="25" font-weight="900" fill="white">${seq[i]}</text></g>`;
  originalBottom+=`<g transform="translate(${p},0)"><circle cx="0" cy="515" r="10" fill="url(#node)"/><rect x="-22" y="445" width="44" height="54" rx="11" fill="${colors[comp[i]]}"/><text x="0" y="481" text-anchor="middle" font-size="25" font-weight="900" fill="white">${comp[i]}</text></g>`;
 });
 setSvg(`<path d="M ${left} 105 Q 600 82 ${right} 105" fill="none" stroke="${oldRail}" stroke-width="15" stroke-linecap="round" filter="url(#shadow)"/>
 <path d="M ${left} 515 Q 600 538 ${right} 515" fill="none" stroke="${oldRail}" stroke-width="15" stroke-linecap="round" filter="url(#shadow)"/>
 ${originalTop}${originalBottom}
 <text x="90" y="52" font-size="18" font-weight="900" fill="#234a96">Original strand 1</text>
 <text x="90" y="575" font-size="18" font-weight="900" fill="#234a96">Original strand 2</text>
 <g id="upperNew"></g><g id="lowerNew"></g>
 <g transform="translate(1120,307)"><circle r="48" fill="rgba(47,124,255,.12)" stroke="#2f7cff" stroke-width="3" stroke-dasharray="7 7"/><text x="0" y="-4" text-anchor="middle" font-size="16" font-weight="900" fill="#235bc7">DNA</text><text x="0" y="16" text-anchor="middle" font-size="14" font-weight="800" fill="#235bc7">polymerase</text></g>`);
 let i=0;
 function step(){
  if(i>=seq.length){
   later(()=>{
    const up=document.getElementById('upperNew'),low=document.getElementById('lowerNew');
    if(up)up.insertAdjacentHTML('afterbegin',`<path d="M ${left} 255 Q 600 278 ${right} 255" fill="none" stroke="${newRail}" stroke-width="15" stroke-linecap="round" filter="url(#shadow)"/>`);
    if(low)low.insertAdjacentHTML('afterbegin',`<path d="M ${left} 365 Q 600 342 ${right} 365" fill="none" stroke="${newRail}" stroke-width="15" stroke-linecap="round" filter="url(#shadow)"/>`);
   },250);
   later(()=>{
    const up=document.getElementById('upperNew'),low=document.getElementById('lowerNew');
    if(up)up.insertAdjacentHTML('beforeend',`<text x="930" y="225" font-size="17" font-weight="900" fill="#238393">New complementary strand</text><text x="90" y="298" font-size="18" font-weight="900" fill="#203c78">Daughter DNA molecule 1</text>`);
    if(low)low.insertAdjacentHTML('beforeend',`<text x="930" y="397" font-size="17" font-weight="900" fill="#238393">New complementary strand</text><text x="90" y="343" font-size="18" font-weight="900" fill="#203c78">Daughter DNA molecule 2</text>`);
   },650);
   later(render,4300);return;
  }
  const up=document.getElementById('upperNew'),low=document.getElementById('lowerNew'),xi=x[i];
  if(up){
   up.insertAdjacentHTML('beforeend',`<g transform="translate(${xi},0)" opacity="0" class="new-upper"><line x1="0" y1="170" x2="0" y2="205" stroke="#8b9ab5" stroke-width="3" stroke-dasharray="5 5"/><rect x="-22" y="205" width="44" height="54" rx="11" fill="${colors[comp[i]]}" stroke="rgba(20,35,65,.25)" stroke-width="2"/><circle cx="0" cy="255" r="10" fill="url(#node)"/><text x="0" y="241" text-anchor="middle" font-size="25" font-weight="900" fill="white">${comp[i]}</text></g>`);
   const el=up.lastElementChild;requestAnimationFrame(()=>{el.style.transition='opacity .35s ease,transform .45s ease';el.style.opacity='1';el.setAttribute('transform',`translate(${xi},0)`)})
  }
  if(low){
   low.insertAdjacentHTML('beforeend',`<g transform="translate(${xi},0)" opacity="0" class="new-lower"><circle cx="0" cy="365" r="10" fill="url(#node)"/><rect x="-22" y="365" width="44" height="54" rx="11" fill="${colors[seq[i]]}" stroke="rgba(20,35,65,.25)" stroke-width="2"/><line x1="0" y1="419" x2="0" y2="445" stroke="#8b9ab5" stroke-width="3" stroke-dasharray="5 5"/><text x="0" y="401" text-anchor="middle" font-size="25" font-weight="900" fill="white">${seq[i]}</text></g>`);
   const el=low.lastElementChild;requestAnimationFrame(()=>{el.style.transition='opacity .35s ease,transform .45s ease';el.style.opacity='1';el.setAttribute('transform',`translate(${xi},0)`)})
  }
  i++;later(step,480)
 }
 later(step,700)
}


function animateTranscription(seq){
 const x=basePositions(seq.length),template=seq.split('').map(b=>complements[b]),rnaMap={A:'U',T:'A',C:'G',G:'C'},mrna=template.map(b=>rnaMap[b]);
 const left=x[0]-45,right=x.at(-1)+45;
 let dnaTop='',dnaBottom='';
 x.forEach((p,i)=>{
  dnaTop+=`<g transform="translate(${p},0)"><circle cx="0" cy="22" r="10" fill="url(#node)"/><rect x="-22" y="32" width="44" height="56" rx="12" fill="${colors[seq[i]]}"/><text x="0" y="69" text-anchor="middle" font-size="25" font-weight="900" fill="white">${seq[i]}</text></g>`;
  dnaBottom+=`<g transform="translate(${p},0)"><circle cx="0" cy="386" r="10" fill="url(#node)"/><rect x="-22" y="310" width="44" height="56" rx="12" fill="${colors[template[i]]}"/><text x="0" y="347" text-anchor="middle" font-size="25" font-weight="900" fill="white">${template[i]}</text></g>`;
 });
 setSvg(`<path d="M ${left} 24 Q 600 4 ${right} 24" fill="none" stroke="url(#rail)" stroke-width="15" stroke-linecap="round"/>
 <path d="M ${left} 386 Q 600 410 ${right} 386" fill="none" stroke="url(#rail)" stroke-width="15" stroke-linecap="round"/>
 ${dnaTop}${dnaBottom}
 <text x="96" y="16" font-size="18" font-weight="800" fill="#203c78">Coding DNA strand</text>
 <text x="96" y="438" font-size="18" font-weight="800" fill="#203c78">Template DNA strand</text>
 <g id="uracilNote" transform="translate(826,62)">
   <rect x="0" y="0" width="280" height="58" rx="15" fill="rgba(209,75,184,.12)" stroke="#c54cb2" stroke-width="2"/>
   <rect x="14" y="12" width="34" height="34" rx="9" fill="#d14bb8"/>
   <text x="31" y="35" text-anchor="middle" font-size="20" font-weight="900" fill="white">U</text>
   <text x="62" y="25" font-size="16" font-weight="900" fill="#8e3f9d">RNA switch:</text>
   <text x="62" y="43" font-size="15" font-weight="800" fill="#8e3f9d">Uracil (U) replaces Thymine (T)</text>
 </g>
 <text x="878" y="186" font-size="18" font-weight="800" fill="#8e3f9d">mRNA strand</text>
 <g id="polymerase" transform="translate(${x[0]-70},0)">
   <ellipse cx="0" cy="274" rx="58" ry="72" fill="#7b57d1" opacity=".95" filter="url(#shadow)"/>
   <ellipse cx="0" cy="274" rx="36" ry="48" fill="#a98ae9"/>
   <text x="0" y="269" text-anchor="middle" font-size="15" font-weight="900" fill="white">RNA</text>
   <text x="0" y="289" text-anchor="middle" font-size="15" font-weight="900" fill="white">polymerase</text>
 </g>
 <g id="mrna"></g>`);
 let i=0;
 function step(){
  if(i>=seq.length){later(()=>{const g=document.getElementById('mrna');if(g){g.style.transition='transform 1s ease';g.setAttribute('transform','translate(0,-8)')}},500);later(render,3600);return}
  const pol=document.getElementById('polymerase'),g=document.getElementById('mrna');
  if(pol){pol.style.transition='transform .55s ease';pol.setAttribute('transform',`translate(${x[i]},0)`)}
  if(g){
   let rna='';
   if(i>=0){
    const xStart=x[0], xEnd=x[i];
    rna += `<path d="M ${xStart} 192 Q ${(xStart+xEnd)/2} 176 ${xEnd} 192" fill="none" stroke="#b85ac7" stroke-width="11" stroke-linecap="round" opacity=".95"/>`;
   }
   for(let j=0;j<=i;j++){
    const fill=mrna[j]==='U'?'#d14bb8':colors[mrna[j]];
    const extra=mrna[j]==='U' ? `<circle cx="0" cy="167" r="28" fill="rgba(209,75,184,.15)" stroke="#d14bb8" stroke-width="2.5" stroke-dasharray="4 4"/>` : '';
    const tag=mrna[j]==='U' ? `<text x="0" y="126" text-anchor="middle" font-size="12" font-weight="900" fill="#a53793">U replaces T</text>` : '';
    rna += `<g transform="translate(${x[j]},0)">${extra}${tag}<circle cx="0" cy="192" r="9" fill="#d992dd" stroke="rgba(20,35,65,.18)" stroke-width="1.5"/><line x1="0" y1="200" x2="0" y2="212" stroke="#a751b2" stroke-width="4"/><rect x="-21" y="136" width="42" height="52" rx="11" fill="${fill}" stroke="rgba(20,35,65,.25)" stroke-width="2"/><text x="0" y="170" text-anchor="middle" font-size="25" font-weight="900" fill="white">${mrna[j]}</text><line x1="0" y1="188" x2="0" y2="310" stroke="#9facc7" stroke-width="2.5" stroke-dasharray="5 5" opacity=".85"/></g>`;
   }
   g.innerHTML=rna;
  }
  i++; later(step,650)
 }
 later(step,700)
}

tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');mode=t.dataset.type;render()}));sequence.addEventListener('input',render);mutant.addEventListener('change',render);

const canvas=document.getElementById('dnaCanvas'),ctx=canvas.getContext('2d');let bases=Array.from({length:100},()=>['A','C','G','T'][Math.floor(Math.random()*4)]),zoom=1,cam=0,drag=false,last=0;
function resizeCanvas(){const r=zoomWrap.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0)}
function drawCanvas(){if(mode!=='zoom')return;const w=zoomWrap.clientWidth,h=zoomWrap.clientHeight;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(cam,0);const content=w*zoom,bw=content/bases.length,c=h/2;ctx.lineWidth=14;ctx.strokeStyle='#416ab5';ctx.beginPath();ctx.moveTo(0,c-80);ctx.lineTo(content,c-80);ctx.moveTo(0,c+80);ctx.lineTo(content,c+80);ctx.stroke();for(let i=0;i<bases.length;i++){const x=(i+.5)*bw;if(x+cam<-40||x+cam>w+40)continue;const top=bases[i],bot=complements[top],rw=Math.max(5,bw*.72);ctx.fillStyle=colors[top];ctx.fillRect(x-rw/2,c-72,rw,62);ctx.fillStyle=colors[bot];ctx.fillRect(x-rw/2,c+10,rw,62);if(zoom>3){ctx.strokeStyle='#8fa2c2';ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(x,c-9);ctx.lineTo(x,c+9);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='white';ctx.font='bold 16px Inter';ctx.textAlign='center';ctx.fillText(top,x,c-35);ctx.fillText(bot,x,c+48)}}ctx.restore()}
canvas.addEventListener('wheel',e=>{e.preventDefault();const old=zoom;zoom=Math.max(1,Math.min(15,zoom+(e.deltaY<0?.5:-.5)));const mx=e.offsetX;cam-=((w=>w*zoom)(zoomWrap.clientWidth)-(zoomWrap.clientWidth*old))*(mx/zoomWrap.clientWidth);const min=zoomWrap.clientWidth-zoomWrap.clientWidth*zoom;cam=Math.min(0,Math.max(min,cam));drawCanvas()},{passive:false});canvas.addEventListener('mousedown',e=>{drag=true;last=e.clientX});addEventListener('mouseup',()=>drag=false);addEventListener('mousemove',e=>{if(!drag)return;cam+=e.clientX-last;last=e.clientX;const min=zoomWrap.clientWidth-zoomWrap.clientWidth*zoom;cam=Math.min(0,Math.max(min,cam));drawCanvas()});addEventListener('resize',()=>{if(mode==='zoom'){resizeCanvas();drawCanvas()}});
render();
</script>
