<div #viewport class="arena-viewport" [attr.aria-label]="ariaLabel()"></div>

<div class="viewport-badge" [class.dragon-pit]="appearance() === 'dragon-pit'" aria-live="polite">
  @if (appearance() === 'dragon-pit') {
    <span class="badge-rune" aria-hidden="true">&#5845;</span>
    <span class="badge-copy">
      <small>Berk training grounds</small>
      <strong>Dragon duel ring</strong>
    </span>
  } @else {
    <span class="status-dot" aria-hidden="true"></span>
    <span>Physics Arena</span>
  }
</div>
