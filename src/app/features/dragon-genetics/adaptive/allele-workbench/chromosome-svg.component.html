<svg
  class="chromosome-svg"
  [class.chromosome-svg--placeholder]="placeholder()"
  [attr.viewBox]="compact() ? '0 6 100 20' : '0 0 100 44'"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  [attr.aria-label]="summary()"
>
  <defs>
    <clipPath [attr.id]="clipId">
      <path [attr.d]="shapePath()" />
    </clipPath>
    <pattern
      [attr.id]="hatchId"
      width="1.8"
      height="1.8"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <line x1="0" y1="0" x2="0" y2="1.8" stroke="var(--hatch-line)" stroke-width="0.45" />
    </pattern>
    <pattern [attr.id]="crosshatchId" width="2.2" height="2.2" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 2.2 2.2 M 2.2 0 L 0 2.2" stroke="var(--hatch-line)" stroke-width="0.42" />
      <circle cx="1.1" cy="1.1" r="0.28" fill="var(--pattern-accent)" />
    </pattern>
    <pattern [attr.id]="dotsId" width="2.4" height="2.4" patternUnits="userSpaceOnUse">
      <circle cx="0.6" cy="0.6" r="0.48" fill="var(--hatch-line)" />
      <circle cx="1.8" cy="1.8" r="0.3" fill="var(--pattern-accent)" />
    </pattern>
    <filter [attr.id]="glowId" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g [attr.clip-path]="'url(#' + clipId + ')'">
    @for (band of bands(); track $index) {
      <rect
        class="chromosome-band"
        [class.chromosome-band--placeholder]="placeholder()"
        [attr.x]="band.x"
        y="8"
        [attr.width]="band.width"
        height="16"
        [attr.fill]="placeholder() ? null : band.color"
        [attr.data-band-start]="band.start"
        [attr.data-band-end]="band.end"
      />
      @if (!placeholder() && band.pattern) {
        <rect
          class="chromosome-band-pattern"
          [attr.x]="band.x"
          y="8"
          [attr.width]="band.width"
          height="16"
          [attr.fill]="patternFill(band.pattern)"
          [attr.data-pattern]="band.pattern"
        />
      }
    }
  </g>

  <path class="chromosome-outline" [attr.d]="shapePath()" />
  <line
    class="centromere-line"
    [attr.x1]="centromereX()"
    y1="14"
    [attr.x2]="centromereX()"
    y2="18"
  />

  @if (!compact()) {
    <text class="arm-label arm-label--left" x="6.5" y="18">{{ chromosome().leftLabel }}</text>
    <text class="arm-label arm-label--right" [attr.x]="chromosomeRight() + 1.5" y="18">
      {{ chromosome().rightLabel }}
    </text>
  }

  @if (!placeholder()) {
    @for (locus of loci(); track locus.label) {
      <g
        class="gene-locus"
        [class.gene-locus--active]="locus.active"
        [class.gene-locus--interactive]="interactive()"
        [attr.data-locus]="locus.label"
        (click)="selectLocus(locus.label)"
      >
        @if (interactive()) {
          <rect class="locus-hit-target" [attr.x]="locus.x - 4.5" y="4" width="9" height="32" />
        }
        <line
          class="gene-marker"
          [attr.x1]="locus.x"
          y1="6"
          [attr.x2]="locus.x"
          y2="27"
          [attr.stroke]="locus.color"
          [attr.filter]="locus.active ? 'url(#' + glowId + ')' : null"
        />
        @if (locus.active || interactive()) {
          <circle
            [attr.cx]="locus.x"
            cy="16"
            [attr.r]="locus.active ? 2.1 : 1.35"
            [attr.fill]="locus.color"
          />
          @if (locus.symbol) {
            <text class="allele-symbol" [attr.x]="locus.x" y="5.1" [attr.fill]="locus.color">
              {{ locus.symbol }}
            </text>
          }
          <text class="locus-label" [attr.x]="locus.x" y="34.5">{{ locus.label }}</text>
        }
      </g>
    }
  }
</svg>
