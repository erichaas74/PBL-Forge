<svg
  class="chromosome-svg"
  [class.chromosome-svg--placeholder]="placeholder()"
  [class.chromosome-svg--replicated]="replicated() || !!pairedChromosome()"
  [attr.viewBox]="compact() ? (replicated() || pairedChromosome() ? '0 0 100 32' : '0 6 100 20') : '0 0 100 44'"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  [attr.aria-label]="summary()"
>
  <defs>
    @for (chromatid of chromatids(); track chromatid.id) {
      <clipPath [attr.id]="clipId + '-' + chromatid.id">
        <path [attr.d]="chromatid.shapePath" />
      </clipPath>
    }
    <pattern
      [attr.id]="hatchId"
      width="1.8"
      height="1.8"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <line x1="0" y1="0" x2="0" y2="1.8" stroke="var(--hatch-line)" stroke-width="0.45" />
    </pattern>
    <pattern [attr.id]="stripeAId" width="5" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="4" fill="var(--stripe-coral)" />
      <rect x="1" width="1" height="4" fill="var(--stripe-gold)" />
      <rect x="2" width="1" height="4" fill="var(--stripe-blue)" />
      <rect x="3" width="1" height="4" fill="var(--stripe-green)" />
      <rect x="4" width="1" height="4" fill="var(--stripe-violet)" />
    </pattern>
    <pattern [attr.id]="stripeBId" width="5" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="4" fill="var(--stripe-blue)" />
      <rect x="1" width="1" height="4" fill="var(--stripe-violet)" />
      <rect x="2" width="1" height="4" fill="var(--stripe-coral)" />
      <rect x="3" width="1" height="4" fill="var(--stripe-gold)" />
      <rect x="4" width="1" height="4" fill="var(--stripe-green)" />
    </pattern>
    <pattern
      [attr.id]="chromatinId"
      width="8"
      height="5"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(-8)"
    >
      <path class="dna-helix-path" d="M-1 1.1 C1 1.1 1 3.9 3 3.9 S5 1.1 7 1.1 S9 3.9 11 3.9" />
      <path class="dna-helix-path" d="M-1 3.9 C1 3.9 1 1.1 3 1.1 S5 3.9 7 3.9 S9 1.1 11 1.1" />
    </pattern>
    <pattern
      [attr.id]="telomereId"
      width="2"
      height="2"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)"
    >
      <rect width="1" height="2" fill="#ffffff" opacity="0.14" />
      <rect x="1" width="1" height="2" fill="#000000" opacity="0.12" />
    </pattern>
    <linearGradient [attr.id]="lightingId" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>
    <filter [attr.id]="glowId" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  @for (chromatid of chromatids(); track chromatid.id) {
    <g
      class="chromatid"
      [class.chromatid--primary]="chromatid.primary"
      [class.chromatid--sister]="!chromatid.primary"
      [attr.data-chromatid]="chromatid.id"
      [attr.transform]="chromatid.transform"
    >
      <g [attr.clip-path]="'url(#' + clipId + '-' + chromatid.id + ')'">
        @for (band of chromatid.bands; track $index) {
          <rect
            class="chromosome-band"
            [class.chromosome-band--placeholder]="placeholder()"
            [attr.x]="band.x"
            y="8"
            [attr.width]="band.width"
            height="16"
            [attr.fill]="placeholder() ? null : band.color"
            [attr.data-band-start]="band.start"
            [attr.data-band-end]="band.end"
          />
          @if (!placeholder() && band.pattern) {
            <rect
              class="chromosome-band-pattern"
              [attr.x]="band.x"
              [attr.y]="band.patternPlacement === 'center' ? 12 : 8"
              [attr.width]="band.width"
              [attr.height]="band.patternPlacement === 'center' ? 8 : 16"
              [attr.fill]="patternFill(band.pattern)"
              [attr.data-pattern]="band.pattern"
              [attr.data-pattern-placement]="band.patternPlacement ?? 'full'"
            />
          }
        }
        <rect
          class="telomere-cap"
          [attr.x]="chromatid.left"
          y="5"
          [attr.width]="chromatid.width * 0.02"
          height="22"
          [attr.fill]="'url(#' + telomereId + ')'"
        />
        <rect
          class="telomere-cap"
          [attr.x]="chromatid.left + chromatid.width * 0.98"
          y="5"
          [attr.width]="chromatid.width * 0.02"
          height="22"
          [attr.fill]="'url(#' + telomereId + ')'"
        />
        <rect
          class="chromatin-texture"
          [attr.x]="chromatid.left"
          y="5"
          [attr.width]="chromatid.width"
          height="22"
          [attr.fill]="'url(#' + chromatinId + ')'"
        />
        <rect
          class="volumetric-lighting"
          [attr.x]="chromatid.left"
          y="8"
          [attr.width]="chromatid.width"
          height="16"
          [attr.fill]="'url(#' + lightingId + ')'"
        />
      </g>

      <path class="chromosome-outline" [attr.d]="chromatid.shapePath" />
      <line
        class="centromere-line"
        [attr.x1]="chromatid.centromereX"
        y1="14"
        [attr.x2]="chromatid.centromereX"
        y2="18"
      />
      <circle class="kinetochore-base" [attr.cx]="chromatid.centromereX" cy="16" r="3" />
      <circle class="kinetochore-inner" [attr.cx]="chromatid.centromereX" cy="16" r="1.5" />

      @if (!placeholder()) {
        @for (locus of chromatid.loci; track locus.label) {
          <g
            class="gene-locus"
            [class.gene-locus--active]="locus.active"
            [class.gene-locus--visible]="showAllLoci()"
            [class.gene-locus--interactive]="chromatid.primary && interactive()"
            [attr.data-locus]="chromatid.primary ? locus.label : null"
            (click)="chromatid.primary && selectLocus(locus.label)"
          >
            @if (chromatid.primary && interactive()) {
              <rect class="locus-hit-target" [attr.x]="locus.x - 4.5" y="4" width="9" height="32" />
            }
            <line
              class="gene-marker gene-marker-subtle"
              [attr.x1]="locus.x"
              y1="6"
              [attr.x2]="locus.x"
              y2="27"
              [attr.stroke]="locus.color"
              [attr.filter]="locus.active ? 'url(#' + glowId + ')' : null"
            />
            <g
              class="allele-barcode-group"
              [attr.transform]="'translate(' + locus.x + ',10)'"
              [attr.data-barcode-variant]="locus.barcodeVariant"
            >
              @if (locus.hasAllele) {
                <rect class="barcode-highlight" x="-5" y="-1.5" width="10" height="15" rx="1.5" />
              }
              @for (stripe of locus.barcode; track $index) {
                <g
                  class="allele-barcode-stripe"
                  [attr.transform]="'translate(' + stripe.offset + ',0)'"
                  [attr.opacity]="stripe.opacity"
                >
                  <rect x="0" y="0" width="0.8" height="6" [attr.fill]="stripe.topFill" />
                  <rect x="0" y="6" width="0.8" height="6" [attr.fill]="stripe.bottomFill" />
                  <rect class="allele-barcode-outline" x="0" y="0" width="0.8" height="12" />
                </g>
              }
            </g>
            @if (locus.active || interactive() || showAllLoci()) {
              @if (chromatid.primary) {
                @if (locus.symbol) {
                  <text class="allele-symbol" [attr.x]="locus.x" y="5.1" [attr.fill]="locus.color">
                    {{ locus.symbol }}
                  </text>
                }
                <text class="locus-label" [attr.x]="locus.x" y="34.5">{{ locus.label }}</text>
              }
            }
          </g>
        }
      }
    </g>
  }

  @if (replicated() || pairedChromosome()) {
    <circle
      class="centromere-joint"
      [attr.cx]="centromereX()"
      cy="16"
      r="2.4"
      aria-hidden="true"
    />
  }

  @if (!compact()) {
    <text class="arm-label arm-label--left" x="6.5" y="18">{{ chromosome().leftLabel }}</text>
    <text class="arm-label arm-label--right" [attr.x]="chromosomeRight() + 1.5" y="18">
      {{ chromosome().rightLabel }}
    </text>
  }
</svg>
