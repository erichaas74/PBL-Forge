<section
  class="dragon-chromosome-selector"
  [class.is-disabled]="disabled()"
  [class.is-compact]="compact()"
  [attr.aria-label]="label()"
>
  <header class="selector-header">
    <div>
      <small>SPECIMEN CARD DECK</small><strong>{{ label() }}</strong>
    </div>
    @if (selectedDragon(); as dragon) {
      <span>
        {{ dragon.name }} · {{ dragon.sex === 'female' ? 'XX' : 'XY' }} ·
        {{ selectedChromosome().label }}
      </span>
    }
  </header>

  <app-fanned-card-deck
    [class.compact]="compact()"
    [items]="dragons()"
    [activeId]="selectedDragon().id"
    [cardTemplate]="selectorCard"
    [labelFor]="cardLabel"
    [subtitleFor]="cardSubtitle"
    [disabled]="disabled()"
    [ariaLabel]="label()"
    (activeItemChange)="selectDragon($event)"
  />

  <ng-template #selectorCard let-dragon let-active="active" let-renderLive="renderLive">
    @if (cardViews().get(dragon.id); as cardView) {
      @if (cardGenomeViews().get(dragon.id); as genomeView) {
        <app-dragon-flip-card
          [card]="cardView"
          [genome]="genomeView"
          [selectedChromosome]="selectedCardChromosome()"
          [flipped]="isCardFlipped(dragon.id)"
          [active]="active && !disabled()"
          [renderLive]="renderLive"
          [footerLeft]="selectedGeneCount() + ' genes on selected pair'"
          [footerRight]="genomeView.sexChromosomes"
          (flipRequested)="toggleCard(dragon.id)"
          (chromosomeSelected)="selectChromosome($event)"
        />
      }
    }
  </ng-template>
</section>
