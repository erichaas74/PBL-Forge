<div class="mini-card-adapter" [class.is-selected]="selected()" [class.is-disabled]="disabled()">
  <app-dragon-flip-card
    [card]="sharedCard()"
    [genome]="sharedGenome()"
    [selectedChromosome]="selectedChromosome()"
    [flipped]="flipped()"
    [active]="!disabled()"
    [renderPortrait]="renderPortrait()"
    [animatedPortrait]="animatedPortrait() && selected()"
    [revealedGeneIds]="revealedGeneIds()"
    footerLeft="Mini Dragon Society"
    [footerRight]="standardLine()"
    [flipTestId]="'mini-card-flip-' + card().id"
    (flipRequested)="toggleFlip()"
    (chromosomeSelected)="selectedChromosome.set($event)"
  />
  <button
    type="button"
    class="mini-card-adapter__select"
    [disabled]="disabled()"
    [attr.aria-pressed]="selected()"
    [attr.data-testid]="'mini-card-select-' + card().id"
    (click)="select()"
  >
    {{ selected() ? 'Selected' : selectLabel() }}
  </button>
</div>
