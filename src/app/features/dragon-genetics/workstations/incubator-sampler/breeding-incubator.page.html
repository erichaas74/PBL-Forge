<app-dragon-workstation-host-shell
  [launchContext]="launchContext()"
  directTitle="Breeding Incubator"
>
  @if (pendingEvidence(); as evidence) {
    <app-dragon-evidence-capture-card
      [evidence]="evidence"
      (capture)="capturePendingEvidence()"
      (dismiss)="pendingEvidence.set(null)"
    />
  }
  @if (evidenceMessage()) {
    <p class="evidence-status" role="status">{{ evidenceMessage() }}</p>
  }
  <app-incubator-sampler
    [studentId]="studentId()"
    [revealedGeneIds]="revealedGeneIds()"
    goal="Breed example dragons and compare how many offspring arrive in each visible-trait bucket."
    (batchSaved)="handleBatchSaved($event)"
  />
</app-dragon-workstation-host-shell>
