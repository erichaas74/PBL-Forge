<aside class="evidence-card" aria-label="Capture lesson evidence">
  <small>Evidence available</small>
  <strong>{{ summary() }}</strong>
  <span>{{ prompt() }}</span>
  <div>
    <button type="button" class="capture" (click)="capture.emit()">Attach evidence</button>
    <button type="button" (click)="dismiss.emit()">Not now</button>
  </div>
</aside>
